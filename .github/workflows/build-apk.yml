name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone and Setup WebView App
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "Starting build for: ${{ github.event.client_payload.app_name }}"
          git clone --depth 1 https://github.com/huzefa99/Android-WebView-Template.git template
          cd template
          
          # استبدال رابط المتجر واسم التطبيق داخل ملف النصوص
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s|https://example.com|${{ github.event.client_payload.store_url }}|g" app/src/main/res/values/strings.xml || true
            sed -i "s|WebView App|${{ github.event.client_payload.app_name }}|g" app/src/main/res/values/strings.xml || true
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find & Prepare APK
        run: |
          mkdir -p output
          find template/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/${{ github.event.client_payload.app_name }}-app.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.event.client_payload.app_id }}-${{ github.run_number }}
          name: "${{ github.event.client_payload.app_name }} APK"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
