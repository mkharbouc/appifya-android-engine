name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Setup Node.js & Bubblewrap
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize and Build Android APK
        run: |
          npm install -g @bubblewrap/cli
          
          APP_NAME="${{ github.event.client_payload.app_name }}"
          STORE_URL="${{ github.event.client_payload.store_url }}"
          
          # إنشاء مشروع أندرويد قياسي متوافق مع متطلبات النظام
          bubblewrap init --manifest="${STORE_URL}/manifest.json" --directory=android-app || {
            # في حال لم يكن للموقع ملف manifest، نقوم بإنشائه افتراضياً
            mkdir -p android-app
            cd android-app
            npx @bubblewrap/cli init --url="$STORE_URL" --manifest="$STORE_URL"
            cd ..
          }
          
          cd android-app
          bubblewrap build --skipPwaValidation

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android-app -name "*.apk" -exec cp {} output/${{ github.event.client_payload.app_name }}.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.event.client_payload.app_id }}-${{ github.run_number }}
          name: "${{ github.event.client_payload.app_name }} APK"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
