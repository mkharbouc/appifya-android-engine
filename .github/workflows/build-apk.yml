name: Build Android APK

on:
  repository_dispatch:
    types:
      - build_apk

  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        default: "Appifya App"
      store_url:
        description: "Store URL"
        required: true
        default: "https://appifya.app"
      app_id:
        description: "App ID"
        required: false
        default: "manual-build"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name || 'Appifya App' }}
      STORE_URL: ${{ github.event.client_payload.store_url || inputs.store_url || 'https://appifya.app' }}
      APP_ID: ${{ github.event.client_payload.app_id || inputs.app_id || 'manual-build' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$APP_NAME" ]; then
            echo "APP_NAME is empty"
            exit 1
          fi

          if [[ ! "$STORE_URL" =~ ^https:// ]]; then
            echo "STORE_URL must start with https://"
            exit 1
          fi

          echo "Building application: $APP_NAME"
          echo "Target URL: $STORE_URL"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-app/app/src/main/java/com/appifya/app
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values

          cat <<'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Appifya"
          include(":app")
          EOF

          cat <<'EOF' > android-app/build.gradle
          plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          EOF

          cat <<'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat <<'EOF' > android-app/app/build.gradle
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.appifya.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.appifya.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.webkit:webkit:1.10.0"
          }
          EOF

          cat <<EOF > android-app/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          cat <<'EOF' > android-app/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat <<'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          cat <<EOF > android-app/app/src/main/java/com/appifya/app/MainActivity.java
          package com.appifya.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${STORE_URL}");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat <<'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd android-app

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK file
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          SAFE_NAME="$(echo "$APP_NAME" | tr -cd '[:alnum:]_.-' | cut -c1-60)"

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="appifya-app"
          fi

          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
            "output/${SAFE_NAME}.apk"

          echo "APK_FILE=output/${SAFE_NAME}.apk" >> "$GITHUB_ENV"
          echo "SAFE_NAME=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.APP_ID }}-${{ github.run_number }}
          name: "${{ env.APP_NAME }} Android APK"
          body: |
            Android APK generated by Appifya.

            Application: ${{ env.APP_NAME }}
            Website: ${{ env.STORE_URL }}
            Workflow run: ${{ github.run_number }}
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
