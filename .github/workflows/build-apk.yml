name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare App Source
        run: |
          echo "App Name: ${{ github.event.client_payload.app_name }}"
          echo "Store URL: ${{ github.event.client_payload.store_url }}"
          # استنساخ قالب WebView خفيف وتطبيق الإعدادات
          git clone https://github.com/swayangjit/Android-Webview-App-Template.git app-template
          cd app-template
          # تعديل رابط المتجر داخل الكود
          sed -i "s|https://google.com|${{ github.event.client_payload.store_url }}|g" app/src/main/java/com/swayangjit/webview/MainActivity.java || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: app-template/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'repository_dispatch'
        with:
          tag_name: apk-${{ github.event.client_payload.app_id }}-${{ github.run_number }}
          name: "APK Build: ${{ github.event.client_payload.app_name }}"
          files: app-template/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
